[project]
name = "p2-model-gateway"
version = "0.1.0"
description = "Local OpenAI-compatible model gateway for the existing Java application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "anyio==4.9.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
